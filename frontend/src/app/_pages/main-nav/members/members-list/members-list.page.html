<ion-content [fullscreen]="true" class="ion-content-padding">
  @if (currentUser$ | async; as currentUser) {
    <h1>Membres de {{ currentUser.teams[0]?.club?.name }}</h1>

    <ion-card class="card-list">
      <app-table
        [apiEndpoint]="'users'"
        [displayedColumns]="displayedColumnList"
        [itemRoute]="'/members'">
      </app-table>
    </ion-card>
  }
</ion-content>
